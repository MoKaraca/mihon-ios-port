name: Build Mihon iOS (.ipa)

on:
  push:
    branches:
      - main
      - ios-port
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build Mihon iOS Framework & Sideloadable .ipa
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build KMP Shared Framework (iosArm64)
        run: |
          ./gradlew :ios-shared:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace

      - name: Install XcodeGen & Generate Mihon.xcodeproj
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          cd iosApp
          xcodegen generate

      - name: Build Mihon.app for iOS Device (Unsigned for AltStore / SideStore / TrollStore)
        run: |
          xcodebuild build \
            -project iosApp/Mihon.xcodeproj \
            -scheme Mihon \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath iosApp/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Mihon-iOS.ipa & AltStore/SideStore Source Manifest
        run: |
          APP_PATH=$(find iosApp/build/DerivedData -name "Mihon.app" -type d | head -n 1)
          echo "Found Mihon.app at: $APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/Mihon.app
          cd build/ipa
          zip -r9 ../Mihon-iOS.ipa Payload
          cd ../..
          IPA_SIZE=$(stat -f%z build/Mihon-iOS.ipa)
          cat <<EOF > build/altstore-source.json
          {
            "name": "Mihon iOS Official Source",
            "identifier": "app.mihon.ios.source",
            "apps": [
              {
                "name": "Mihon",
                "bundleIdentifier": "app.mihon.ios",
                "developerName": "Mihon Open Source Contributors",
                "localizedDescription": "Free and open source manga, manhwa, and webtoon reader for iOS.",
                "versions": [
                  {
                    "version": "0.21.3",
                    "date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
                    "downloadURL": "https://github.com/${{ github.repository }}/releases/latest/download/Mihon-iOS.ipa",
                    "size": $IPA_SIZE,
                    "minOSVersion": "16.0"
                  }
                ]
              }
            ]
          }
          EOF

      - name: Upload Mihon-iOS.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mihon-iOS-IPA
          path: |
            build/Mihon-iOS.ipa
            build/altstore-source.json
          if-no-files-found: error

